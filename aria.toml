# aria.toml —— 基准配置（人写；程序永不重写本文件，注释安全）
#
# 读取时机：**启动时读一次**。运行期的改动走网页设置面板——面板保存只写
# aria.override.toml（机器文件），立即生效并持久化到下次启动；本文件作为基准，
# 与 override 冲突时 override 优先（面板上每项显示「基准值 / 已覆盖」两态）。
# 手改本文件后想生效：重启进程，或在面板点「重新读取」。

[host]                              # 宿主装配（aria-host 启动项的基准；同名 flag 显式给出时仅本次覆盖）
backend = "http://127.0.0.1:8800"    # TTS 后端根地址（非 gateway 模式下也是 ASR 地址）
# asr_gateway = "ws://172.16.53.179:8210"  # 非空 = ASR 走 asr-gateway（EPYC VM WS；需 device；TTS 仍走 backend）
# device = "http://127.0.0.1:18900"        # launcher 控制面；空 = 本机 paplay 出声、无灯无视觉
# light_colors = "202020,00a000,2050ff"    # 灯色 idle,listening,thinking（hex，逗号分隔）
# no_asr = false        # 停用 ASR 插头（纯终端开发）
# no_stdin = false      # 停用 stdin 插头（纯语音形态）
# no_tts = false        # 停用 TTS 播放（只看文字）
# no_input_gate = false # 关闭播放期间的半双工输入保护
# no_light = false      # 停用状态灯
# no_mic_mute = false   # 停用播放期间闭耳
# no_vision = false     # 停用视觉注入
speak_tool = true    # TTS 改为 speak 工具：模型显式调用出声（可阻塞/非阻塞），正文不再自动朗读
# fake / api-key 不进本段：前者是冒烟开关（--fake）、后者是秘密（--api-key 或
# provider.api_key_env 指的环境变量），都只走 flag/环境。

[server]
listen = "127.0.0.1:8080"      # 只绑本机；暴露局域网需显式修改（本口能触发 LLM 花费）

[provider]
kind = "deepseek"                        # deepseek（官方端点特化：思考等级/流式 toolcall 细节/官方 finish_reason）| openai 或留空（OpenAI 兼容端点通用，含 DeepSeek/GLM/Kimi/Ollama）
base_url = "https://api.deepseek.com"   # deepseek kind 可省略（默认官方端点；/v1 别名亦可）；openai kind 默认官方 OpenAI
model = "deepseek-flash"                 # 稳定默认：V4.1-Flash（tool calls + 视觉 + 思考，并发 2500，输入 1 元/M 档）；备选 deepseek-v4-pro（无视觉，勿用于摄像头注入）；deepseek kind 留空也用它
api_key_env = "ARIA_API_KEY"   # key 本体永远在环境变量，不落任何文件；deepseek kind 另兜底 DEEPSEEK_API_KEY
# context_window = 0             # 模型上下文窗口（token）；0 = 适配器内置值（deepseek 按模型名查表；openai 无内置值，未配置时不按用量压缩）
# max_output = 0                 # 请求未设 max_tokens 时的输出上限（token）；0 = 适配器内置值

[persona]
# 二选一，file 优先
system_prompt = ""
system_prompt_file = ""        # 例："persona/default.md"

[session]
id = "aria"                     # 会话标识前缀：每个会话的标识为 <id>-<开始时刻>，如 aria-20261001-153045.123
default_user = "user"
namespace = "default"           # 长期记忆的命名空间：每个家庭一个，全员共享
idle_timeout_s = 1800           # 最近一轮结束后该时长（秒）内没有新输入：上下文清空，之后的输入进入新会话（不带入上一会话的摘要与原文）；0 = 不切换

[llm]                           # 热调区：网页面板改动立即生效（每请求 Options 覆盖）
#temperature = 0.7              # 不设（默认）= 请求里不下发该字段，用 provider 模型默认；思考模式下服务端本就忽略它
#max_tokens = 8192              # 不设（默认）= 不限；thinking 型模型一般不用这两个旋钮（思考态默认 64K，effort=max 128K）
#reasoning_effort = "high"      # 思考等级（kind=deepseek 生效）：none/low/high/max；不设 = 不下发，用服务端默认（思考开/high）。注意压缩摘要请求也会继承本值

[compress]
strategy = "provider"           # provider（调 LLM 压成摘要）| keeplast（不调 LLM，只留最近 N 条）
keep_last_n = 0                 # strategy = "keeplast" 时的条数；0 = 引擎默认
keep_recent_turns = 2           # 压缩时保留原文的近轮数 K（两种策略通用）；压缩进行中结算的轮次不计入 K
# 压缩按上下文用量触发：剩余量（模型窗口 − 用量）低于预留量时压缩。
# 预留量 = max(reserve_ratio × 窗口, 单轮) + concurrent_turns × 单轮，单轮 = 输出上限 + turn_reserve_tokens。
# 模型窗口与缺省输出上限由 provider 按模型给出（[provider] 的 context_window / max_output 可覆盖）。
reserve_ratio = 0.10            # 预留量不低于窗口的比例
turn_reserve_tokens = 16384     # 单轮输入预留（用户输入 + 工具结果），单位 token
concurrent_turns = 1            # 压缩与对话并发期间额外预留的轮数；负数 = 不额外预留
# 将来会有第三个策略 twopart（软摘要 + 硬台账），届时这里加个名字即可
# model = ""                    # provider 策略的模型覆盖；空 = 跟随 provider.model
# instruction = ""              # provider 策略的提示词覆盖；空 = 默认提示词

[tools]
builtin = ["bash"]  # 共享注册表（plugins/tool/basic）；bash 以宿主身份执行任意命令，不想要就去掉；lorem 是 aria-demo 专属

[record]
path = ""                       # 例："chat.jsonl"；空 = 不落盘

[limits]
max_turns = 0                   # 0 = 引擎默认（100）
tool_timeout_ms = 30000         # 单个工具执行上限（毫秒）；0 = 不限时（挂死的工具会占住本轮，慎用）
